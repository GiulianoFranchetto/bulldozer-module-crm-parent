server:
  port: 43200

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://auth.bulldozer-collective.fr/realms/bdz-saas-dev"
  application:
    name: bulldozer-module-crm
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        read-date-timestamps-as-nanoseconds: false
        write-date-keys-as-timestamps: true
        write-date-timestamps-as-nanoseconds: false
        write-dates-as-timestamps: true
        write-durations-as-timestamps: true

bulldozer:
  jobs:
    init-sql: true
  crm:
    hubspot:
      # An OAuth app gets roughly 110 requests / 10 s per installed account. 100ms between calls keeps the
      # aggregate rate just under that whatever the number of syncs in flight. The retry path keys off
      # HubSpot's own Retry-After header, so this is a safety margin rather than the actual quota.
      min-request-interval: 100ms
      max-retries: 4
      initial-backoff: 1s
      max-backoff: 30s
      # Guard against a paging cursor that never terminates; a real portal is far below this.
      max-pages-per-object: 10000
  # Restricts what a token minted by a hosted site's OAuth client may do (hosting-guard-starter).
  # Uses its own least-privilege Keycloak service account (realm-management:view-clients only).
  # Flip BDZ_HOSTING_GUARD_ENABLED on once that service account exists and its secret is deployed;
  # the service logs a warning at startup while it is off.
  hosting-guard:
    enabled: ${BDZ_HOSTING_GUARD_ENABLED:false}
    fail-closed: false
    cache-ttl: 5m
    whitelisted-client-ids:
      - "postman"
      - "bulldozer-internal-modulith"
      - "bulldozer-os"
      - "bulldozer-os-admin"
    keycloak:
      realm: "bdz-saas-dev"
      url: "https://auth.bulldozer-collective.fr"
      client-id: "bulldozer-hosting-guard"
      client-secret: "${BDZ_HOSTING_GUARD_SECRET:}"

# Health probe read by the status server (status.bulldozer-collective.fr) every 30 minutes.
# Only `health` is exposed, with no details: the response must say up or down and nothing else.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
